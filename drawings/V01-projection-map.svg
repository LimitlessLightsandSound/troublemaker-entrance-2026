th="3"/><text x="1205" y="585">W2</text><text x="100" y="650">A1 + A2: Epson 13K projectors</text><text x="100" y="683">12.30′ towers • 24″ top plates</text><text x="785" y="650">W1 + W2: Epson 13K projectors</text><text x="785" y="683">9.84′ towers • 24″ top plates</text><path d="M680 145V720" class="dim dash"/><text x="65" y="765">SHARED SYSTEM: media server / SDI distribution / generator / 120–208V distro</text><text x="65" y="802">Projectors on 208V branches • Socapex + True1 • protected cable routes and crossovers</text><text x="65" y="844" class="small">Separate target diagrams, not a site plan. Beam areas indicate coverage intent only; positions, throws and lens selection are not fixed.</text><path d="M24 892H1376" class="dim"/><text x="55" y="927" class="small">PRELIMINARY • Not to scale • Final coverage, overlap, sightlines and weather protection subject to site survey</text><text x="55" y="955" class="small">LIMITLESS LIGHTS + SOUND</text><text x="1280" y="955" class="small">V01</text></svg>